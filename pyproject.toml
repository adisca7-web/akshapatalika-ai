[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaapai"
version = "0.1.0"
description = "A deterministic US GAAP layer for conversational financial analysis, with a reference skill pack distilled from Wiley GAAP 2020."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# The kernel is deliberately dependency-free: exact decimal money, ASC
# citations, workpapers, and routing all run on the standard library. That is
# what lets it run on any interpreter.
dependencies = []

[project.optional-dependencies]
# Charts and DataFrame adapters.
data = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7.0"]
# Everything the Streamlit app needs, in one install.
app = ["pandas>=2.0", "matplotlib>=3.7", "streamlit>=1.30", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["gaapai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
