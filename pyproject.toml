[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaapai"
version = "0.1.0"
description = "A deterministic US GAAP layer for conversational financial analysis, with a reference skill pack distilled from Wiley GAAP 2020."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# The kernel is deliberately dependency-free: exact decimal money, ASC
# citations, workpapers, and routing all run on the standard library. That is
# what lets it run on any interpreter.
dependencies = []

[project.optional-dependencies]
# Charts and DataFrame adapters.
data = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7.0"]
# Everything the Streamlit app needs, in one install.
app = ["pandas>=2.0", "matplotlib>=3.7", "streamlit>=1.30", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["gaapai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# The kernel supports Python 3.9, so `Dict`/`Optional` under
# `from __future__ import annotations` are deliberate, not legacy. The pyupgrade
# rules that want PEP 585/604 syntax are therefore off: they would be wrong here.
target-version = "py39"
line-length = 88
extend-exclude = ["extraction", "vendor", "skills"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "RUF"]
ignore = [
  "E501",     # line length is enforced by review, not by a hard failure
  "B008",     # function call in default argument -- used deliberately for Money
  "SIM108",   # ternary is not always clearer than if/else
  "RUF001",   # ambiguous unicode: the docs use en dashes on purpose
  "RUF002",
  "RUF003",
  "RUF005",   # `a + b` on lists reads fine and is clearer than unpacking here
  "SIM105",   # an explicit try/except/pass documents *what* is being ignored
  "SIM102",   # the nested conditions are separate concerns, deliberately apart
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose to assert internal invariants.
"tests/*" = ["E402", "SLF001"]
