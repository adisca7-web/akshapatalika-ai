name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the app is developed against. 3.14 proves the kernel has
        # not quietly acquired a dependency on anything newer. Both operating
        # systems, because the code is written on Windows and path handling and
        # line endings are exactly where that leaks.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the test suite
        # The suite includes tests/test_packaging.py, which asserts the kernel
        # imports nothing beyond the standard library -- so the dependency-free
        # claim is checked here rather than in a separate job that could only
        # ever test what happened to be installed.
        run: uv run --python ${{ matrix.python }} --extra app --extra dev pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned, so a new ruff release cannot fail an unrelated pull request.
      - run: uvx ruff@0.14.2 check .

  reference-pack:
    name: reference pack integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Pack resolves and every citation it relies on exists
        run: uv run --python 3.11 --extra dev python scripts/check_pack.py

  app:
    name: the app starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Every test can pass while the app fails on import -- it has happened
      # here, from a scripted edit that wrote a literal \n into a source line.
      - name: Import the app module without launching a server
        run: |
          uv run --python 3.11 --extra app python -c "
          import ast, pathlib
          src = pathlib.Path('devapp/app.py').read_text(encoding='utf-8')
          ast.parse(src)
          import streamlit, pandas, matplotlib   # noqa: F401
          from gaapai import ask, plan, charts, llm, entity, evaluate, semantics  # noqa: F401
          print('app parses and every module it imports is available')
          "
